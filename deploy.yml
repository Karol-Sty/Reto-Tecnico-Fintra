name: Deploy Fintra Triage a GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar build con la key inyectada
        run: |
          mkdir -p build
          cp index.html build/index.html
          sed -i "s|__GROQ_KEY__|${{ secrets.GROQ_API_KEY }}|g" build/index.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
